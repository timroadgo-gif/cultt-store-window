  <meta name="app-build" content="25bff0f871c8" />
  <script>(()=>{const m=document.querySelector('meta[name="app-build"]');if(!m||!window.fetch)return;const cur=m.content;const url=new URL('version.json',document.baseURI);const check=()=>fetch(url+'?t='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():null).then(v=>{if(!v||!v.build||v.build===cur)return;const k='app-build-reload:'+v.build;try{if(sessionStorage.getItem(k))return;sessionStorage.setItem(k,'1')}catch(e){}const u=new URL(location.href);u.searchParams.set('v',v.build);location.replace(u.href)}).catch(()=>{});check();document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')check()});addEventListener('pageshow',e=>{if(e.persisted)check()})})();</script>

  <body>
    <!-- Welcome / attract screen. It is also the idle state the kiosk returns to. -->
    <main class="welcome" data-screen-id="welcome" aria-labelledby="welcomeTitle">
      <section class="welcome__intro">
        <div class="brand" role="img" aria-label="THE CULTT, ресейл-платформа">
          <span class="brand__logo" aria-hidden="true"></span>
          <span class="brand__tagline ds-text-overline" aria-hidden="true">Ресейл-платформа</span>
        </div>

        <div class="welcome__content">
          <div class="welcome__text">
            <h1 class="welcome__title" id="welcomeTitle">Более 7&nbsp;000 лотов доступны к&nbsp;примерке</h1>
            <p class="welcome__lead">Выберите свои — принесем со&nbsp;склада за&nbsp;несколько минут</p>
          </div>
          <ol class="steps">
            <li class="steps__item"><span class="steps__num ds-corner" data-corner="circular">1</span><span>Выберите лоты</span></li>
            <li class="steps__item"><span class="steps__num ds-corner" data-corner="circular">2</span><span>Нажмите «Заказать на&nbsp;примерку»</span></li>
            <li class="steps__item"><span class="steps__num ds-corner" data-corner="circular">3</span><span>Назовите номер консультанту</span></li>
          </ol>
        </div>

        <div class="welcome__cta" id="welcomeCta"></div>
      </section>

      <!-- Decorative showcase: real catalogue lots, no per-card interaction. -->
      <section class="showcase" id="showcase" aria-hidden="true" data-running="true"></section>
    </main>

    <!-- Catalog (catalog/catalog-screen.js builds the content). -->
    <main class="kc" id="catalogScreen" data-screen-id="catalog" aria-label="Каталог" hidden></main>

    <!-- Placeholder for the step after «Заказать на примерку» (catalog/fitting-screen.js). -->
    <main class="kf" id="fittingScreen" data-screen-id="fitting" aria-labelledby="fittingTitle" hidden></main>

    <script type="module" src="./app.js?v=25bff0f871c8"></script>
  </body>
</html>
