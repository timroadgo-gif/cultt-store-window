<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="description" content="Симулятор iPad для прототипа витрины THE CULTT: выбор устройства и фиксированный экран в горизонтальной ориентации" />
    <title>Витрина THE CULTT — симулятор iPad</title>
    <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png" />
    <link rel="stylesheet" href="./design-system/fonts/fonts.css?v=99a3a2d742ee" />
    <link rel="stylesheet" href="./design-system/tokens/tokens.css?v=99a3a2d742ee" />
    <link rel="stylesheet" href="./design-system/css/corners.css?v=99a3a2d742ee" />
    <link rel="stylesheet" href="./design-system/css/typography.css?v=99a3a2d742ee" />
    <link rel="stylesheet" href="./simulator/simulator.css?v=99a3a2d742ee" />
    <meta name="build" content="99a3a2d742ee" />
  <meta name="app-build" content="99a3a2d742ee" />
  <script>(()=>{const m=document.querySelector('meta[name="app-build"]');if(!m||!window.fetch)return;const cur=m.content;const url=new URL('version.json',document.baseURI);const check=()=>fetch(url+'?t='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():null).then(v=>{if(!v||!v.build||v.build===cur)return;const k='app-build-reload:'+v.build;try{if(sessionStorage.getItem(k))return;sessionStorage.setItem(k,'1')}catch(e){}const u=new URL(location.href);u.searchParams.set('v',v.build);location.replace(u.href)}).catch(()=>{});check();document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')check()});addEventListener('pageshow',e=>{if(e.persisted)check()})})();</script>
  </head>
  <!-- Desktop simulator shell (not customer-facing). The real app is app.html, loaded unchanged in an iframe whose
       size is the selected iPad's landscape CSS viewport; the device is scaled with a transform, never resized. -->
  <body class="sim" data-view="picker">
    <section class="sim-picker" id="picker" aria-labelledby="pickerTitle">
      <div class="sim-picker__inner">
        <p class="sim-picker__eyebrow ds-text-overline">Витрина THE CULTT · прототип</p>
        <h1 class="sim-picker__title" id="pickerTitle">Выберите iPad</h1>
        <p class="sim-picker__lead ds-text-body">Приложение откроется в горизонтальной ориентации с точным размером экрана выбранной модели</p>
        <div class="sim-picker__list" id="deviceList"></div>
        <a class="sim-picker__direct ds-text-body-s" href="./app.html">Открыть без симулятора — для самого iPad</a>
        <p class="sim-picker__build ds-text-body-s" id="buildId"></p>
      </div>
    </section>

    <section class="sim-device" id="device" hidden aria-label="Симулятор iPad">
      <header class="sim-bar" aria-label="Управление симулятором">
        <div class="sim-bar__group">
          <button class="sim-btn" type="button" id="backToPicker">← Все устройства</button>
          <span class="sim-bar__name" id="deviceName"></span>
          <span class="sim-bar__meta ds-text-body-s" id="deviceMeta"></span>
        </div>
        <div class="sim-bar__group">
          <label class="sim-bar__label ds-text-body-s" for="deviceSelect">Устройство</label>
          <select class="sim-select" id="deviceSelect"></select>
          <div class="sim-seg" role="group" aria-label="Масштаб">
            <button class="sim-seg__btn" type="button" data-zoom="fit" aria-pressed="true">Fit</button>
            <button class="sim-seg__btn" type="button" data-zoom="100" aria-pressed="false">100%</button>
          </div>
          <span class="sim-bar__scale ds-text-body-s" id="scaleLabel"></span>
        </div>
      </header>
      <div class="sim-stage" id="stage">
        <div class="sim-slot" id="slot">
          <div class="ipad" id="ipad">
            <span class="ipad__camera" aria-hidden="true"></span>
            <div class="ipad__screen" id="screen">
              <iframe class="ipad__app" id="app" title="Прототип витрины THE CULTT на iPad"></iframe>
            </div>
          </div>
        </div>
      </div>
    </section>

    <script type="module" src="./simulator/simulator.js?v=99a3a2d742ee"></script>
  </body>
</html>
